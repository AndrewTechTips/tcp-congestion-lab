<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reliable transfer over UDP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title">Reliable transfer over UDP</h1>
    <p class="sub" data-i18n="sub">Stop-and-Wait, Go-Back-N, Selective Repeat and TCP congestion control</p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ro" aria-pressed="false">RO</button>
  </div>
</header>

<main>
  <aside>
    <form id="form">
      <label><span data-i18n="protocol">Protocol</span>
        <select name="mode">
          <option value="sw">Stop-and-Wait</option>
          <option value="gbn">Go-Back-N</option>
          <option value="sr">Selective Repeat</option>
          <option value="tahoe">TCP Tahoe</option>
          <option value="reno" selected>TCP Reno</option>
          <option value="newreno">TCP NewReno</option>
        </select>
      </label>

      <div class="presets">
        <span data-i18n="scenarios">Scenarios:</span>
        <button type="button" data-preset="clean" data-i18n="p_clean">clean link</button>
        <button type="button" data-preset="congestion" data-i18n="p_congestion">congestion</button>
        <button type="button" data-preset="lossy" data-i18n="p_lossy">lossy</button>
      </div>

      <fieldset>
        <legend data-i18n="g_file">The file</legend>
        <label><span data-i18n="size">Size</span> <span class="unit">KB</span>
          <input type="number" name="size_kb" value="400" min="1" max="3000"></label>
        <label class="win"><span data-i18n="window">Window (GBN/SR)</span> <span class="unit" data-i18n="u_packets">packets</span>
          <input type="number" name="window" value="8" min="1" max="64"></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="g_link">The link</legend>
        <label><span data-i18n="delay">One-way delay</span> <span class="unit">ms</span>
          <input type="number" name="delay_ms" value="40" min="0" max="500"></label>
        <label><span data-i18n="jitter">Jitter</span> <span class="unit">ms</span>
          <input type="number" name="jitter_ms" value="0" min="0" max="200"></label>
        <label><span data-i18n="rate">Router rate</span> <span class="unit" data-i18n="u_rate">packets/s, 0 = unlimited</span>
          <input type="number" name="rate" value="200" min="0" max="5000"></label>
        <label><span data-i18n="queue">Router queue</span> <span class="unit" data-i18n="u_packets">packets</span>
          <input type="number" name="queue" value="12" min="1" max="500"></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="g_errors">Errors</legend>
        <label><span data-i18n="loss">Data loss</span> <output data-for="loss">0%</output>
          <input type="range" name="loss" min="0" max="0.2" step="0.005" value="0"></label>
        <label><span data-i18n="ack_loss">ACK loss</span> <output data-for="ack_loss">0%</output>
          <input type="range" name="ack_loss" min="0" max="0.2" step="0.005" value="0"></label>
        <label><span data-i18n="corrupt">Corrupted packets</span> <output data-for="corrupt">0%</output>
          <input type="range" name="corrupt" min="0" max="0.1" step="0.005" value="0"></label>
        <label><span data-i18n="seed">Seed</span> <span class="unit" data-i18n="u_seed">same seed, same result</span>
          <input type="number" name="seed" value="1"></label>
      </fieldset>

      <button type="submit" id="go" data-i18n="go">Start the transfer</button>
      <p id="status" class="status"></p>
    </form>
  </aside>

  <section class="content">
    <div id="stats" class="stats"></div>

    <nav class="tabs">
      <button data-tab="cwnd" class="active" data-i18n="tab_cwnd">Congestion window</button>
      <button data-tab="seq" data-i18n="tab_seq">Sequence–time</button>
      <button data-tab="ladder" data-i18n="tab_ladder">Packet diagram</button>
      <button data-tab="compare" data-i18n="tab_cmp">Comparison</button>
    </nav>

    <div class="panel active" id="tab-cwnd">
      <p class="hint" data-i18n="hint_cwnd"></p>
      <canvas id="cwnd" height="360"></canvas>
      <canvas id="rtt" height="180"></canvas>
    </div>

    <div class="panel" id="tab-seq">
      <p class="hint" data-i18n="hint_seq"></p>
      <canvas id="seqplot" height="460"></canvas>
    </div>

    <div class="panel" id="tab-ladder">
      <p class="hint" data-i18n="hint_ladder"></p>
      <div class="ladder-controls">
        <label><span data-i18n="from">From</span> <output id="lstart-out">0.00 s</output>
          <input type="range" id="lstart" min="0" max="1" step="0.001" value="0"></label>
        <label><span data-i18n="span">Span</span>
          <select id="lspan">
            <option value="0.1">0.1 s</option>
            <option value="0.25" selected>0.25 s</option>
            <option value="0.5">0.5 s</option>
            <option value="1">1 s</option>
            <option value="2">2 s</option>
          </select></label>
        <button type="button" id="ljump" data-i18n="jump">Jump to the first loss</button>
      </div>
      <div id="ladder"></div>
    </div>

    <div class="panel" id="tab-compare">
      <p class="hint" data-i18n="hint_cmp"></p>
      <div class="ladder-controls">
        <button type="button" id="cmp-go" data-i18n="cmp_go">Run the comparison</button>
        <span id="cmp-status" class="status"></span>
      </div>
      <canvas id="cmp" height="380"></canvas>
      <div id="cmp-table"></div>
    </div>
  </section>
</main>

<script src="i18n.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
